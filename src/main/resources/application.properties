# LinkVault Configuration
spring.application.name=linkvault

# Dynamic port for Render deployment (defaults to 8080 locally)
server.port=${PORT:8080}

# Automatically import local .env if present (ignored if not present, e.g. on Render)
spring.config.import=optional:file:.env[.properties]

# Target database name
spring.data.mongodb.database=linkvault

# MongoDB Atlas URI (supports MONGODB_URI or MONGODB_URL from .env or environment)
spring.data.mongodb.uri=${MONGODB_URI:${MONGODB_URL:mongodb://localhost:27017/linkvault}}
spring.data.mongodb.auto-index-creation=true
